# Workflow DÙNG CHUNG (workflow_call): promote image theo tree hash cho test/prod.
# Có image tree-<hash> (do develop build) -> chỉ gắn thêm tag, KHÔNG build lại.
# Không có -> build lại (fallback) và cảnh báo: nghĩa là code này chưa đi qua dev.
name: _promote

on:
  workflow_call:
    inputs:
      env_tag:
        description: 'test | prod'
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.promote.outputs.digest }}
      promoted:
        value: ${{ jobs.promote.outputs.promoted }}

permissions:
  contents: read
  id-token: write

env:
  IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/todo/todo-api

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.pick.outputs.digest }}
      promoted: ${{ steps.pick.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse --short=12 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: check
        name: Image tree-<hash> đã có chưa?
        run: |
          if DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:tree-${{ steps.meta.outputs.tree }}" --format='value(image_summary.digest)' 2>/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "✅ Promote: dùng lại image $DIGEST (tree-${{ steps.meta.outputs.tree }}), không build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Không có image tree-${{ steps.meta.outputs.tree }}: code này chưa qua dev, build lại (fallback)."
          fi
      - name: Gắn tag ${{ inputs.env_tag }}-latest lên image đã có
        if: steps.check.outputs.found == 'true'
        run: |
          gcloud artifacts docker tags add "${IMAGE}@${{ steps.check.outputs.digest }}" "${IMAGE}:${{ inputs.env_tag }}-latest"
          gcloud artifacts docker tags add "${IMAGE}@${{ steps.check.outputs.digest }}" "${IMAGE}:${{ inputs.env_tag }}-sha-${{ steps.meta.outputs.sha }}"
      # ----- Fallback: build lại y như develop -----
      - if: steps.check.outputs.found != 'true'
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - if: steps.check.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.check.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.check.outputs.found != 'true'
        env:
          TRIVY_VERSION: 0.76.0
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz trivy
          ./trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --format table "${IMAGE}:scan"
      - id: build
        if: steps.check.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:tree-${{ steps.meta.outputs.tree }}
            ${{ env.IMAGE }}:${{ inputs.env_tag }}-latest
          cache-from: type=gha
      - id: pick
        run: |
          if [ "${{ steps.check.outputs.found }}" = "true" ]; then
            echo "digest=${{ steps.check.outputs.digest }}" >> "$GITHUB_OUTPUT"; echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"; echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi
